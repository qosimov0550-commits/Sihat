name: APK yig'ish

on:
  push:
    paths:
      - '**.zip'
      - 'patches/**'
      - '.github/workflows/**'
      - 'rasmlar/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Loyihani tayyorlash (arxiv + patchlar)
        run: |
          rm -rf build && mkdir build && cd build
          unzip -q "$(ls ../*.zip | head -1)"
          cd Sihat
          for p in ../../patches/*.patch; do
            echo "== $p"
            patch -p1 --no-backup-if-mismatch < "$p"
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Mashq rasmlari (rasmlar/ papkasidan)
        working-directory: build/Sihat
        run: |
          pip install -q pillow
          python3 tools/gen_frames.py "$GITHUB_WORKSPACE/rasmlar"
      - name: Ovoz fayllari (o'zbekcha murabbiy)
        continue-on-error: true
        working-directory: build/Sihat
        run: |
          pip install -q edge-tts
          python3 tools/gen_voice.py
      - name: Imzo kaliti (Secrets -> SIHAT_KEY)
        env:
          SIHAT_KEY: ${{ secrets.SIHAT_KEY }}
        run: |
          if [ -n "$SIHAT_KEY" ]; then
            printf '%s' "${SIHAT_KEY#*:}" | base64 -d > "$RUNNER_TEMP/sihat.jks"
            echo "SIHAT_KS=$RUNNER_TEMP/sihat.jks" >> "$GITHUB_ENV"
            echo "::add-mask::${SIHAT_KEY%%:*}"
            echo "SIHAT_KS_PW=${SIHAT_KEY%%:*}" >> "$GITHUB_ENV"
            echo "Doimiy kalit bilan imzolanadi"
          else
            echo "::warning::SIHAT_KEY topilmadi - vaqtinchalik kalit bilan imzolanadi, reliz chiqarilmaydi"
          fi
      - name: APK yig'ish
        working-directory: build/Sihat
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Sihat-v${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: Sihat-apk
          path: Sihat-v${{ github.run_number }}.apk
      - name: Reliz (ilova ichidan yangilanish uchun)
        if: env.SIHAT_KS != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v${{ github.run_number }}" "Sihat-v${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" --title "Sihat v${{ github.run_number }}" --notes "${NOTES:-Yangilanish}"
